[package]
name = "tpt-jsonl-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Streaming, zero-allocation JSON Lines (.jsonl) parser"
keywords = ["jsonl", "json-lines", "streaming", "parser", "zero-allocation"]
categories = ["parsing", "encoding"]
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[features]
simd = ["dep:simd-json"]
tokio = ["dep:tokio"]
rayon = ["dep:rayon"]

[dependencies.simd-json]
version = "0.13"
optional = true

[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["io-util", "rt", "macros"]

[dependencies.rayon]
version = "1"
optional = true

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "bench"
harness = false
