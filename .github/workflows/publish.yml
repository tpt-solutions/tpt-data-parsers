name: Publish

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Dry-run verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test (all features)
        run: cargo test --all --all-features

      - name: test tpt-mime-pure (no_std)
        run: cargo test --no-default-features -p tpt-mime-pure

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: semver checks
        run: cargo semver-checks check-release --workspace

      - name: publish dry-run (each crate)
        run: |
          for c in tpt-logfmt-parse tpt-cron-parse tpt-mime-pure tpt-jsonl-stream tpt-geo-geojson; do
            cargo publish -p "$c" --dry-run --allow-dirty
          done

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: publish tpt-logfmt-parse
        run: cargo publish -p tpt-logfmt-parse
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish tpt-cron-parse
        run: cargo publish -p tpt-cron-parse
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish tpt-mime-pure
        run: cargo publish -p tpt-mime-pure
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish tpt-jsonl-stream
        run: cargo publish -p tpt-jsonl-stream
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish tpt-geo-geojson
        run: cargo publish -p tpt-geo-geojson
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
