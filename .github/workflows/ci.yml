name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (all features, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test (all features)
        run: cargo test --all --all-features

      - name: test tpt-mime-pure (no_std)
        run: cargo test --no-default-features -p tpt-mime-pure

  test-default:
    name: Test (default features, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: test (default features)
        run: cargo test --workspace

  msrv:
    name: MSRV (1.71)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.71.0
      - uses: Swatinem/rust-cache@v2

      - name: test (all features)
        run: cargo test --workspace --all-features --exclude tpt-cli --lib --tests

      - name: test tpt-mime-pure (no_std)
        run: cargo test --no-default-features -p tpt-mime-pure

  doc:
    name: Docs dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (all features, no deps)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: check
        run: cargo semver-checks check-release --workspace

  no_std:
    name: no_std target build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: build tpt-mime-pure (no_std, bare-metal target)
        run: cargo build -p tpt-mime-pure --no-default-features --target thumbv7em-none-eabi

  fuzz:
    name: Fuzz targets (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build and short-run fuzz targets
        run: |
          for c in tpt-jsonl-stream tpt-geo-geojson tpt-logfmt-parse tpt-cron-parse tpt-mime-pure; do
            (cd "$c/fuzz" && cargo +nightly fuzz build)
            for t in $(cd "$c/fuzz" && cargo +nightly fuzz list); do
              (cd "$c/fuzz" && cargo +nightly fuzz run "$t" -- -max_total_time=20)
            done
          done
