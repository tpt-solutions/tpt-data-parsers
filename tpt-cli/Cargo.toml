[package]
name = "tpt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line front-end for the tpt-data-parsers workspace (cron, mime, geojson, jsonl, logfmt)"
readme = "README.md"
publish = false

[dependencies]
# Capped below 4.6: clap 4.6+ requires the Rust 2024 edition, which the 1.71 MSRV
# toolchain cannot parse. This keeps the `msrv` CI job (and the no_std libs'
# 1.71 guarantee) green while still tracking 4.5.x security fixes.
clap = { version = ">=4.5, <4.6", features = ["derive"] }
clap_complete = ">=4.5, <4.7"
chrono = "0.4"
serde_json = { workspace = true }
tpt-jsonl-stream = { path = "../tpt-jsonl-stream" }
tpt-geo-geojson = { path = "../tpt-geo-geojson" }
tpt-logfmt-parse = { path = "../tpt-logfmt-parse" }
tpt-cron-parse = { path = "../tpt-cron-parse", features = ["chrono"] }
tpt-mime-pure = { path = "../tpt-mime-pure" }
